apply plugin: 'com.android.application'

android {
    namespace 'com.venice.cfpanel'
    compileSdk 34
    buildToolsVersion '34.0.0'
    defaultConfig {
        applicationId "com.venice.cfpanel"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes {
        release { minifyEnabled false }
    }
}
dependencies { }
